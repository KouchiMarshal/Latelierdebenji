name: Verifier les options de compte client

on:
  workflow_dispatch: {}

jobs:
  check-account-options:
    runs-on: ubuntu-latest
    steps:
      - name: Installer sshpass
        run: sudo apt-get update -y >/dev/null && sudo apt-get install -y sshpass >/dev/null

      - name: Préparer le script distant
        run: |
          mkdir -p /tmp/acctcheck
          cat > /tmp/acctcheck/run.sh <<'EOF'
          #!/bin/sh
          set -e
          cd "$HOME/www"
          if command -v wp >/dev/null 2>&1; then
            WP="wp"
          else
            if [ ! -f "$HOME/wp-cli.phar" ]; then
              curl -sS -o "$HOME/wp-cli.phar" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
              chmod +x "$HOME/wp-cli.phar"
            fi
            WP="php $HOME/wp-cli.phar"
          fi

          echo "--- Inscription WordPress generale (Reglages > General) ---"
          $WP option get users_can_register

          echo "--- Options d'inscription WooCommerce ---"
          $WP option get woocommerce_enable_myaccount_registration 2>/dev/null || echo "non defini"
          $WP option get woocommerce_enable_signup_and_login_from_checkout 2>/dev/null || echo "non defini"
          $WP option get woocommerce_enable_guest_checkout 2>/dev/null || echo "non defini"
          $WP option get woocommerce_registration_generate_username 2>/dev/null || echo "non defini"
          $WP option get woocommerce_registration_generate_password 2>/dev/null || echo "non defini"
          EOF

      - name: Envoyer le script sur le serveur
        run: |
          sshpass -p "${{ secrets.OVH_FTP_PASSWORD }}" scp -o StrictHostKeyChecking=no -P 22 \
            /tmp/acctcheck/run.sh \
            "${{ secrets.OVH_FTP_USERNAME }}@${{ secrets.OVH_FTP_SERVER }}:~/"

      - name: Verifier via WP-CLI
        run: |
          sshpass -p "${{ secrets.OVH_FTP_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p 22 "${{ secrets.OVH_FTP_USERNAME }}@${{ secrets.OVH_FTP_SERVER }}" 'chmod +x ~/run.sh && sh ~/run.sh && rm -f ~/run.sh'
