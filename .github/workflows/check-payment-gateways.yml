name: Verifier l'etat des moyens de paiement

on:
  workflow_dispatch: {}

jobs:
  check-payments:
    runs-on: ubuntu-latest
    steps:
      - name: Installer sshpass
        run: sudo apt-get update -y >/dev/null && sudo apt-get install -y sshpass >/dev/null

      - name: Préparer le script distant
        run: |
          mkdir -p /tmp/paycheck
          cat > /tmp/paycheck/run.sh <<'EOF'
          #!/bin/sh
          set -e
          cd "$HOME/www"
          if command -v wp >/dev/null 2>&1; then
            WP="wp"
          else
            if [ ! -f "$HOME/wp-cli.phar" ]; then
              curl -sS -o "$HOME/wp-cli.phar" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
              chmod +x "$HOME/wp-cli.phar"
            fi
            WP="php $HOME/wp-cli.phar"
          fi

          echo "--- Passerelles de paiement WooCommerce ---"
          $WP wc payment_gateway list --user=1 --fields=id,title,enabled 2>/dev/null || $WP eval '
            $gateways = WC()->payment_gateways()->payment_gateways();
            foreach ( $gateways as $gateway ) {
              echo $gateway->id . " | " . $gateway->get_method_title() . " | enabled=" . $gateway->enabled . "\n";
            }
          '

          echo "--- Stripe : mode test/live et cle publique configuree (sans secrets) ---"
          $WP eval '
            $settings = get_option( "woocommerce_stripe_settings" );
            if ( $settings ) {
              echo "enabled: " . ( $settings["enabled"] ?? "non defini" ) . "\n";
              echo "testmode: " . ( $settings["testmode"] ?? "non defini" ) . "\n";
              echo "cle publishable live renseignee: " . ( ! empty( $settings["publishable_key"] ) ? "oui" : "non" ) . "\n";
              echo "cle secrete live renseignee: " . ( ! empty( $settings["secret_key"] ) ? "oui" : "non" ) . "\n";
              echo "cle publishable test renseignee: " . ( ! empty( $settings["test_publishable_key"] ) ? "oui" : "non" ) . "\n";
            } else {
              echo "Aucun reglage Stripe trouve.\n";
            }
          '

          echo "--- PayPal Payments : etat de connexion (sans secrets) ---"
          $WP eval '
            $settings = get_option( "woocommerce-ppcp-settings" );
            if ( $settings ) {
              echo "client_id renseigne: " . ( ! empty( $settings["client_id"] ) ? "oui" : "non" ) . "\n";
              echo "sandbox_on: " . ( $settings["sandbox_on"] ?? "non defini" ) . "\n";
            } else {
              echo "Aucun reglage PayPal Payments trouve (pas encore connecte).\n";
            }
          '
          EOF

      - name: Envoyer le script sur le serveur
        run: |
          sshpass -p "${{ secrets.OVH_FTP_PASSWORD }}" scp -o StrictHostKeyChecking=no -P 22 \
            /tmp/paycheck/run.sh \
            "${{ secrets.OVH_FTP_USERNAME }}@${{ secrets.OVH_FTP_SERVER }}:~/"

      - name: Verifier via WP-CLI
        run: |
          sshpass -p "${{ secrets.OVH_FTP_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p 22 "${{ secrets.OVH_FTP_USERNAME }}@${{ secrets.OVH_FTP_SERVER }}" 'chmod +x ~/run.sh && sh ~/run.sh && rm -f ~/run.sh'
