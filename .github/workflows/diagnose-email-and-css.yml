name: Diagnostic ponctuel email + CSS
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose via SSH
        env:
          OVH_HOST: ${{ secrets.OVH_FTP_SERVER }}
          OVH_USER: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_PASS: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          cat > /tmp/remote.sh << 'REMOTE_EOF'
          cd ~/www

          WPCLI="wp"
          if ! command -v wp &> /dev/null; then
            WPCLI="php $HOME/wp-cli.phar"
          fi

          echo "=== col2-set rule present in file on disk ==="
          grep -n "col2-set" wp-content/themes/atelier-benji/assets/css/main.css || echo "non trouve"

          echo "=== main.css version header on disk ==="
          head -5 wp-content/themes/atelier-benji/assets/css/main.css || true

          echo "=== style.css version on disk ==="
          grep -i version wp-content/themes/atelier-benji/style.css || true

          echo "=== Active plugins ==="
          $WPCLI plugin list --status=active --fields=name,status 2>&1 || true

          echo "=== WooCommerce email settings ==="
          $WPCLI eval 'foreach (WC()->mailer()->get_emails() as $email) { echo $email->id . " | enabled=" . ($email->is_enabled() ? "yes" : "no") . "\n"; }' 2>&1 || true

          echo "=== WP mail-related options ==="
          $WPCLI option get admin_email 2>&1 || true
          $WPCLI option get woocommerce_email_from_address 2>&1 || true
          $WPCLI option get woocommerce_email_from_name 2>&1 || true

          echo "=== Check for SMTP plugin ==="
          $WPCLI plugin list --fields=name,status 2>&1 | grep -i -E "smtp|mail" || echo "Aucun plugin SMTP trouve"

          echo "=== Test wp_mail send ==="
          $WPCLI eval 'var_export( wp_mail( get_option("admin_email"), "Test envoi WordPress", "Ceci est un test." ) );' 2>&1 || true

          echo "=== mail function available? ==="
          $WPCLI eval 'echo function_exists("mail") ? "mail() existe" : "mail() absente";' 2>&1 || true

          echo "=== Recent PHP error log (mail-related) ==="
          find ~/logs -maxdepth 2 -iname "*error*" 2>/dev/null
          tail -n 300 ~/logs/*error*.log 2>/dev/null | grep -i mail || echo "Pas de log d'erreur mail trouve ou pas de fichier de log"
          REMOTE_EOF

          sshpass -p "$OVH_PASS" ssh -o StrictHostKeyChecking=no "$OVH_USER@$OVH_HOST" 'bash -s' < /tmp/remote.sh
