name: Installer WP Mail SMTP
on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Installer et activer le plugin via SSH
        env:
          OVH_HOST: ${{ secrets.OVH_FTP_SERVER }}
          OVH_USER: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_PASS: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          cat > /tmp/remote.sh << 'REMOTE_EOF'
          cd ~/www
          WPCLI="wp"
          if ! command -v wp &> /dev/null; then
            WPCLI="php $HOME/wp-cli.phar"
          fi

          echo "=== Installation de WP Mail SMTP ==="
          $WPCLI plugin install wp-mail-smtp --activate 2>&1

          echo "=== Statut du plugin ==="
          $WPCLI plugin list --fields=name,status 2>&1 | grep -i smtp
          REMOTE_EOF

          sshpass -p "$OVH_PASS" ssh -o StrictHostKeyChecking=no "$OVH_USER@$OVH_HOST" 'bash -s' < /tmp/remote.sh
