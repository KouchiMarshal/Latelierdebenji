name: Diagnostic ponctuel email + CSS
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose via SSH
        env:
          OVH_HOST: ${{ secrets.OVH_FTP_SERVER }}
          OVH_USER: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_PASS: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          cat > /tmp/remote.sh << 'REMOTE_EOF'
          cd ~/www
          WPCLI="wp"
          if ! command -v wp &> /dev/null; then
            WPCLI="php $HOME/wp-cli.phar"
          fi

          echo "=== site url ==="
          $WPCLI option get siteurl
          $WPCLI option get home

          echo "=== atelier-benji directory full tree ==="
          find wp-content/themes/atelier-benji 2>&1

          echo "=== active theme ==="
          $WPCLI theme list --status=active
          REMOTE_EOF

          sshpass -p "$OVH_PASS" ssh -o StrictHostKeyChecking=no "$OVH_USER@$OVH_HOST" 'bash -s' < /tmp/remote.sh
