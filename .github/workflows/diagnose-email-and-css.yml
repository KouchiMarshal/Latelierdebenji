name: Diagnostic ponctuel email + CSS
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose via SSH
        env:
          OVH_HOST: ${{ secrets.OVH_FTP_SERVER }}
          OVH_USER: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_PASS: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          cat > /tmp/remote.sh << 'REMOTE_EOF'
          cd ~/www 2>/dev/null || cd ~/latelierdebenji.fr 2>/dev/null || cd ~
          echo "=== pwd ==="
          pwd
          echo "=== ls -la (cwd) ==="
          ls -la
          echo "=== find wp-config.php from cwd, maxdepth 3 ==="
          find . -maxdepth 3 -name "wp-config.php" 2>/dev/null
          REMOTE_EOF

          sshpass -p "$OVH_PASS" ssh -o StrictHostKeyChecking=no "$OVH_USER@$OVH_HOST" 'bash -s' < /tmp/remote.sh
