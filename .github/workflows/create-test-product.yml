name: Creer un article de test paiement

on:
  workflow_dispatch: {}

jobs:
  create-test-product:
    runs-on: ubuntu-latest
    steps:
      - name: Installer sshpass
        run: sudo apt-get update -y >/dev/null && sudo apt-get install -y sshpass >/dev/null

      - name: Préparer le script distant
        run: |
          mkdir -p /tmp/testproduct
          cat > /tmp/testproduct/run.sh <<'EOF'
          #!/bin/sh
          set -e
          cd "$HOME/www"
          if command -v wp >/dev/null 2>&1; then
            WP="wp"
          else
            if [ ! -f "$HOME/wp-cli.phar" ]; then
              curl -sS -o "$HOME/wp-cli.phar" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
              chmod +x "$HOME/wp-cli.phar"
            fi
            WP="php $HOME/wp-cli.phar"
          fi

          PRODUCT_ID=$($WP wc product create \
            --name="Article test paiement" \
            --type=simple \
            --regular_price=2.00 \
            --status=publish \
            --catalog_visibility=hidden \
            --short_description="Produit de test a 2 euros, utilise uniquement pour verifier le bon fonctionnement des paiements. A supprimer une fois les tests termines." \
            --user=1 \
            --porcelain 2>/dev/null || true)

          if [ -z "$PRODUCT_ID" ]; then
            PRODUCT_ID=$($WP eval '
              $product = new WC_Product_Simple();
              $product->set_name( "Article test paiement" );
              $product->set_regular_price( "2.00" );
              $product->set_price( "2.00" );
              $product->set_status( "publish" );
              $product->set_catalog_visibility( "hidden" );
              $product->set_short_description( "Produit de test a 2 euros, utilise uniquement pour verifier le bon fonctionnement des paiements. A supprimer une fois les tests termines." );
              $id = $product->save();
              echo $id;
            ')
          fi

          echo "--- Produit cree ---"
          echo "ID: $PRODUCT_ID"
          $WP post get "$PRODUCT_ID" --field=post_title
          echo "URL: $($WP post get "$PRODUCT_ID" --field=guid)"
          $WP eval "echo get_permalink( $PRODUCT_ID ) . \"\n\";"
          EOF

      - name: Envoyer le script sur le serveur
        run: |
          sshpass -p "${{ secrets.OVH_FTP_PASSWORD }}" scp -o StrictHostKeyChecking=no -P 22 \
            /tmp/testproduct/run.sh \
            "${{ secrets.OVH_FTP_USERNAME }}@${{ secrets.OVH_FTP_SERVER }}:~/"

      - name: Creer via WP-CLI
        run: |
          sshpass -p "${{ secrets.OVH_FTP_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p 22 "${{ secrets.OVH_FTP_USERNAME }}@${{ secrets.OVH_FTP_SERVER }}" 'chmod +x ~/run.sh && sh ~/run.sh && rm -f ~/run.sh'
